services:
  - type: web
    name: roadies-rebirth
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: SITE_URL
        sync: false
